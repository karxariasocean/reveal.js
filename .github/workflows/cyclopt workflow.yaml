name: Cyclopt Quality Gate - Manual

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: true
        default: 'test'
        type: choice
        options:
          - master
          - develop

jobs:
  cyclopt-analysis:
    runs-on: windows-latest
    # runs-on: >-
    #   ${{ inputs.branch == 'main'
    #       && fromJson('["self-hosted", "Windows", "self-hosted-dmzsrv2"]')
    #       || fromJson('["self-hosted", "Windows", "self-hosted-liferay"]') }}

    steps:
      - name: Get latest commit SHA
        id: get_sha
        shell: pwsh
        # shell: cmd
        run: |
          $response = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.branch }}" `
            -Headers @{
              Authorization = "Bearer ${{ secrets.WORKFLOW_GITHUB_TOKEN }}"
              Accept = "application/vnd.github+json"
            }

          "sha=$($response.sha)" >> $env:GITHUB_OUTPUT
        # for /f "delims=" %%i in ('curl -s -H "Authorization: Bearer ${{ secrets.WORKFLOW_GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.branch }}" ^| jq -r ".sha"') do set SHA=%%i
        # echo sha=%SHA%>> %GITHUB_OUTPUT%

      - name: Get Cyclopt Quality Gate Status
        id: cyclopt
        shell: pwsh
        env:
          CYCLOPS_TOKEN: ${{ secrets.CYCLOPT_TOKEN }}
        # shell: cmd
        run: |
            $url = "https://server.cyclopt.com/cyclopt/openapi/quality-gates/commit/${{ steps.get_sha.outputs.sha }}"

            $errorAttempts      = 0
            $maxErrorAttempts   = 6
            $inProgressSleep    = 0
            $maxInProgressSleep = 600  # 10 minutes in seconds

            $response   = $null
            $status     = "unknown"
            $message    = ""
            $inProgress = $false
            $hasError   = $false
            $success    = $false

            while ($true) {
              try {
                $response = Invoke-RestMethod `
                  -Uri $url `
                  -Headers @{ "x-access-cyclopt-token" = "${{ secrets.CYCLOPT_TOKEN }}" } `
                  -TimeoutSec 30 `
                  -MaximumRetryCount 3 `
                  -RetryIntervalSec 5
              } catch {
                $errorAttempts++
                echo "Connection error (attempt $errorAttempts/$maxErrorAttempts): $_"
                if ($errorAttempts -lt $maxErrorAttempts) {
                  echo "Retrying in 10 seconds..."
                  Start-Sleep -Seconds 10
                  continue
                }
                echo "Max error retry attempts reached. Failing the workflow."
                $status  = "error"
                $message = "Connection failed after $maxErrorAttempts attempts"
                break
              }

              echo "DEBUG: API Response: $($response | ConvertTo-Json -Compress -Depth 10)"

              $inProgress = [bool]$response.inProgress
              $hasError   = [bool]$response.hasError
              $success    = [bool]$response.success
              $message    = if ($response.errorMessage) { $response.errorMessage } else { "" }

              if ($hasError) {
                $errorAttempts++
                echo "Error occurred during analysis: $message (attempt $errorAttempts/$maxErrorAttempts)"
                if ($errorAttempts -lt $maxErrorAttempts) {
                  echo "Retrying after error in 10 seconds..."
                  Start-Sleep -Seconds 10
                  continue
                }
                echo "Max error retry attempts reached. Failing the workflow."
                $status = "error"
                break
              }

              if ($inProgress) {
                echo "Analysis is still in progress."
                if ($inProgressSleep -ge $maxInProgressSleep) {
                  echo "Analysis has been in progress for more than 10 minutes. Timing out."
                  $status  = "inprogress"
                  $message = "Analysis timed out after 10 minutes"
                  break
                }
                echo "Retrying in 5 seconds..."
                $inProgressSleep += 5
                Start-Sleep -Seconds 5
                continue
              }

              if ($success) {
                echo "Analysis succeeded."
                $status = "success"
                break
              } else {
                echo "Analysis failed."
                $status = "failed"
                break
              }
            }

            $passed = if ($null -ne $response -and $null -ne $response.passed) {
              $response.passed | ConvertTo-Json -Compress
            } else { "[]" }

            $failed = if ($null -ne $response -and $null -ne $response.failed -and $response.failed.Count -gt 0) {
              $response.failed | ConvertTo-Json -Compress -Depth 10
            } else { "[]" }

            "status=$status"         >> $env:GITHUB_OUTPUT
            "message=$message"       >> $env:GITHUB_OUTPUT
            "passed=$passed"         >> $env:GITHUB_OUTPUT
            "failed=$failed"         >> $env:GITHUB_OUTPUT
            "inProgress=$inProgress" >> $env:GITHUB_OUTPUT
            "hasError=$hasError"     >> $env:GITHUB_OUTPUT
            "success=$success"       >> $env:GITHUB_OUTPUT

            echo "Status:     $status"
            echo "Message:    $message"
            echo "inProgress: $inProgress"
            echo "hasError:   $hasError"
            echo "success:    $success"
            echo "Passed:     $passed"
            echo "Failed:     $failed"
        # for /f "delims=" %%i in ('curl -s -H "x-access-cyclopt-token: ${{ secrets.CYCLOPT_TOKEN }}" "https://server.cyclopt.com/cyclopt/openapi/quality-gates/commit/%sha%" ^| jq -r "if .hasError then \"error\" elif .inProgress then \"inprogress\" elif .success then \"success\" else \"failed\" end"') do set STATUS=%%i
        # for /f "delims=" %%i in ('curl -s -H "x-access-cyclopt-token: ${{ secrets.CYCLOPT_TOKEN }}" "https://server.cyclopt.com/cyclopt/openapi/quality-gates/commit/%sha%" ^| jq -r ".errorMessage // \"\""') do set MSG=%%i
        # env:
        #   sha: ${{ steps.get_sha.outputs.sha }}

      - name: Notify Teams
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_CHAT_WEBHOOK }}
        shell: pwsh
        run: |
          $status  = "${{ steps.cyclopt.outputs.status }}"
          $message = "${{ steps.cyclopt.outputs.message }}"
          $passed  = '${{ steps.cyclopt.outputs.passed }}'
          $failed  = '${{ steps.cyclopt.outputs.failed }}'
          $runUrl  = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $repo    = "${{ github.repository }}"
          $branch  = "${{ inputs.branch }}"
          $sha     = "${{ steps.get_sha.outputs.sha }}"

          $title = switch ($status) {
            "success"    { "✅ Cyclopt Quality Gate Passed" }
            "failed"     { "❌ Cyclopt Quality Gate Failed" }
            "inprogress" { "⏱️ Cyclopt Analysis Still In Progress" }
            "error"      { "⚠️ Cyclopt Analysis Error" }
            default      { "❓ Cyclopt Analysis - Unknown Result" }
          }

          $body = [System.Collections.Generic.List[object]]::new()

          $body.Add(@{ type = "TextBlock"; text = $title; weight = "Bolder"; size = "Medium"; wrap = $true })
          $body.Add(@{
            type  = "FactSet"
            facts = @(
              @{ title = "Repository"; value = $repo },
              @{ title = "Branch";     value = $branch },
              @{ title = "Commit";     value = $sha }
            )
          })

          if ($message) {
            $body.Add(@{ type = "TextBlock"; text = "⚠️ $message"; color = "Warning"; wrap = $true })
          }

          $passedList = $passed | ConvertFrom-Json
          if ($passedList -and $passedList.Count -gt 0) {
            $body.Add(@{ type = "TextBlock"; text = "**✅ Passed Quality Gates**"; weight = "Bolder"; wrap = $true })
            $body.Add(@{ type = "TextBlock"; text = ($passedList -join ", "); color = "Good"; wrap = $true })
          }

          $failedList = $failed | ConvertFrom-Json
          if ($failedList -and $failedList.Count -gt 0) {
            $body.Add(@{ type = "TextBlock"; text = "**❌ Failed Quality Gates**"; weight = "Bolder"; wrap = $true })
            foreach ($entry in $failedList) {
              $body.Add(@{ type = "TextBlock"; text = "Language: $($entry.language) | Root: $($entry.root)"; isSubtle = $true; wrap = $true })
              foreach ($qg in $entry.qualityGates) {
                $body.Add(@{ type = "TextBlock"; text = "• $($qg.name)"; color = "Attention"; wrap = $true })
                foreach ($cond in $qg.failedConditions) {
                  $body.Add(@{ type = "TextBlock"; text = "  ↳ $cond"; isSubtle = $true; wrap = $true })
                }
              }
            }
          }

          $body.Add(@{
            type    = "ActionSet"
            actions = @(@{ type = "Action.OpenUrl"; title = "View GitHub Actions Run"; url = $runUrl })
          })

          $card = @{
            type        = "message"
            attachments = @(@{
              contentType = "application/vnd.microsoft.card.adaptive"
              content     = [ordered]@{
                '$schema' = "http://adaptivecards.io/schemas/adaptive-card.json"
                type      = "AdaptiveCard"
                version   = "1.2"
                body      = $body.ToArray()
              }
            })
          }

          $card | ConvertTo-Json -Depth 20 -Compress | Out-File -FilePath payload.json -Encoding utf8
          curl -H "Content-Type: application/json" -d "@payload.json" $env:TEAMS_WEBHOOK
